# BuiltInConfig). The SD card's mtg12.toml is applied after these and may override any of them.
#
# src/mtg12_enhancements.cpp is on by its own default.

# The full game, not the trial.
license_mask = 1

# Renut's Direct3D-level renderer on deko3d (the only renderer of the Switch build: no Vulkan driver is linked).
mtg12_renderer = "renut"
renut_gpu_backend = "deko3d"

# No log (the release; 2026-10-22, for the PGO collection and the final build): only a crash writes
# logs/rex/rex_crash.log. A test run turns it on in the SD card's mtg12.toml (log_level = "info",
# log_to_file = true; mtg12_touch_log = true for every touch).
log_level = "off"
log_to_file = false
mtg12_touch_log = false
switch_profile_report = false
switch_profile_stacks = false

xam_guest_signin = true

# The render height in each mode. 720 in both (the game's own 1280x720).
mtg12_render_height_handheld = 720
mtg12_render_height_docked = 720
